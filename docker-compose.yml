version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./soccer_recruit.db
      - MLFLOW_TRACKING_URI=./mlruns
      - API_BASE_URL=http://api:8000/api/v1
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./dashboards:/app/dashboards
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - STREAMLIT_SERVER_HEADLESS=true
    command: streamlit run dashboards/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

  mlflow:
    image: python:3.11-slim
    volumes:
      - ./mlruns:/mlruns
    working_dir: /mlruns
    command: >
      bash -c "pip install mlflow==2.10.0 && mlflow ui --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
